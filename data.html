<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据对比 · 山城重庆</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101620'/%3E%3Cpath d='M4 25L12 11L18 20L21 15L28 25Z' fill='%235aa8ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="wanzhou/fonts/fonts.css">
<style>
:root{--bg:#0a0d12;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.18);
  --ink:#eaf0f8;--ink2:#aeb9c9;--dim:#7d8798;--ac:#5aa8ff;--ac2:#9fd0ff;
  --fd:"Ma Shan Zheng","STKaiti","KaiTi",cursive;--sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 520px at 84% -10%,rgba(90,168,255,.15),transparent 62%)}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 24px}
.topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:rgba(10,13,18,.82);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-family:var(--fd);font-size:22px;color:var(--ac);text-decoration:none}
.topbar nav a{color:var(--ink2);text-decoration:none;font-size:14px;margin-left:18px}
.topbar nav a:hover{color:var(--ac)}
.hero{padding:44px 0 6px}
.hero h1{font-family:var(--fd);font-size:clamp(34px,5vw,52px);font-weight:400;line-height:1.2}
.hero p{color:var(--ink2);font-size:15px;margin-top:10px;max-width:44em}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:26px;padding:24px 0 80px;align-items:start}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.card+.card{margin-top:16px}
.card h2{font-size:14px;letter-spacing:.12em;color:var(--dim);font-weight:600;margin-bottom:14px}
.seg{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.seg button{font:inherit;font-size:12.5px;padding:6px 13px;border-radius:99px;cursor:pointer;
  color:var(--ink2);background:rgba(255,255,255,.03);border:1px solid var(--line);transition:.2s}
.seg button.on{background:linear-gradient(135deg,var(--ac),#3f8fe0);border-color:transparent;color:#fff;font-weight:600}
.dv-bars,.dv-scatter,.dv-groups{width:100%;height:auto;display:block}
.dv-row{cursor:pointer}
.dv-row:hover rect:not([fill="transparent"]){opacity:1}
.dv-row:hover text{fill:#fff}
.dv-pt{cursor:pointer;transition:r .2s}
.dv-pt:hover{r:9}
.note{font-size:11.5px;color:var(--dim);margin-top:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:12px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
</style>
</head>
<body>
<header class="topbar"><div class="wrap">
  <a class="brand" href="index.html">‹ 山城重庆</a>
  <nav><a href="index.html">首页</a><a href="plan.html">行程</a></nav>
</div></header>

<div class="wrap">
  <div class="hero">
    <h1>数据对比</h1>
    <p>37 个区县的地势与收录情况放在一起看。点任意一行或任意一个点，进入该区县。</p>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <h2>区县排行</h2>
        <div class="seg" id="dvSeg">
          <button type="button" data-m="elev" class="on">平均海拔</button>
          <button type="button" data-m="span">地势起伏</button>
          <button type="button" data-m="tags">收录词条</button>
        </div>
        <div id="dvBars"></div>
        <div class="note" id="dvNote"></div>
        <div class="legend">
          <span><i style="background:#ff7a45"></i>主城</span>
          <span><i style="background:#5aa8ff"></i>新区</span>
          <span><i style="background:#f2c14e"></i>渝东北</span>
          <span><i style="background:#3ecfa0"></i>渝东南</span>
        </div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>海拔 × 高差</h2>
        <div id="dvScatter"></div>
      </div>
      <div class="card">
        <h2>片区构成</h2>
        <div id="dvGroups"></div>
      </div>
      <div class="card">
        <h2>口径</h2>
        <p class="note" style="font-size:12.5px;line-height:1.75">
          海拔为县城所在地平均海拔，起伏为区县境内最高与最低之差，均来自站内已标注来源的区县数据。
          词条数指该区县收录的景点 / 美食 / 人文条目数量。
        </p>
      </div>
    </div>
  </div>
</div>

<script defer src="assets/js/data.js"></script>
<script defer src="assets/js/district-links.js?v=20261017c"></script>
<script defer src="assets/js/dataviz.js?v=20261019a"></script>
<script defer src="assets/js/agent.js?v=20261019b"></script>
</body>
</html>
