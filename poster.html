<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的足迹 · 山城重庆</title>
<meta name="description" content="把你在本站走过的重庆区县生成一张可保存的足迹海报：进度环、区县网格与城市剪影。">
<meta property="og:type" content="website">
<meta property="og:title" content="我的足迹 · 山城重庆">
<meta property="og:description" content="把走过的重庆区县生成一张足迹海报。">
<meta property="og:image" content="https://hardaway1227.github.io/chongqing-37/assets/pic/yuzhong/hero.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101620'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ff7a45' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="wanzhou/fonts/fonts.css">
<style>
:root{--bg:#0a0d12;--line:rgba(255,255,255,.09);--ink:#eaf0f8;--ink2:#aeb9c9;--dim:#7d8798;--ac:#ff7a45;
 --fd:"Ma Shan Zheng","STKaiti",cursive;--sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.8;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
.topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:rgba(10,13,18,.82);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-family:var(--fd);font-size:22px;color:var(--ac);text-decoration:none}
.topbar nav a{color:var(--ink2);text-decoration:none;font-size:14px;margin-left:18px}
.topbar nav a:hover{color:var(--ac)}
.hero{padding:42px 0 4px}
.hero h1{font-family:var(--fd);font-size:clamp(32px,5vw,48px);font-weight:400;line-height:1.2}
.hero p{color:var(--ink2);font-size:15px;margin-top:10px;max-width:40em}
.stage{display:grid;grid-template-columns:380px 1fr;gap:28px;padding:28px 0 70px;align-items:start}
@media(max-width:820px){.stage{grid-template-columns:1fr}}
#cv{width:100%;height:auto;border-radius:16px;border:1px solid var(--line);display:block}
.ops{display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;border:0;
 cursor:pointer;font:inherit;font-size:14px;font-weight:600;color:#fff;background:linear-gradient(135deg,#ff7a45,#ff5a2c)}
.btn.ghost{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink2);font-weight:500}
.btn:hover{transform:translateY(-1px)}
.list{margin-top:8px;font-size:13px;color:var(--ink2);line-height:2}
.list b{color:var(--ac)}
.empty{padding:40px 0;text-align:center;color:var(--dim);font-size:13.5px;line-height:2}
</style>
</head>
<body>
<header class="topbar"><div class="wrap">
  <a class="brand" href="index.html">‹ 山城重庆</a>
  <nav><a href="index.html">首页</a><a href="plan.html">行程</a><a href="data.html">数据</a></nav>
</div></header>

<div class="wrap">
  <div class="hero">
    <h1>我的足迹</h1>
    <p>你在本站点开过的重庆区县会记在这张卡片上。生成后可以保存图片，发到群里或答辩时当封面。</p>
  </div>

  <div class="stage">
    <canvas id="cv" width="1080" height="1440" aria-label="我的重庆足迹海报"></canvas>
    <div class="ops">
      <button class="btn" id="dl" type="button">保存图片（PNG）</button>
      <button class="btn ghost" id="reset" type="button">清空足迹</button>
      <div class="list" id="list"></div>
    </div>
  </div>
</div>

<script defer src="assets/js/data.js"></script>
<script defer src="assets/js/poster.js?v=20261019b"></script>
</body>
</html>
