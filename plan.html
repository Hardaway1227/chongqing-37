<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行程规划 · 山城重庆</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101620'/%3E%3Cpath d='M4 25L12 11L18 20L21 15L28 25Z' fill='%23ff7a45'/%3E%3C/svg%3E">
<link rel="stylesheet" href="wanzhou/fonts/fonts.css">
<style>
:root{--bg:#0a0d12;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.18);
  --ink:#eaf0f8;--ink2:#aeb9c9;--dim:#7d8798;--ac:#ff7a45;--ac2:#ffb08f;
  --fd:"Ma Shan Zheng","STKaiti","KaiTi",cursive;--sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 520px at 84% -10%,rgba(255,122,69,.16),transparent 62%),
             radial-gradient(760px 460px at 4% 104%,rgba(90,168,255,.10),transparent 62%)}
a{color:inherit}
.topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:rgba(10,13,18,.82);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 24px}
.brand{font-family:var(--fd);font-size:22px;color:var(--ac);text-decoration:none}
.topbar nav a{color:var(--ink2);text-decoration:none;font-size:14px;margin-left:18px}
.topbar nav a:hover{color:var(--ac)}
.hero{padding:44px 0 10px}
.hero h1{font-family:var(--fd);font-size:clamp(34px,5vw,52px);font-weight:400;line-height:1.2}
.hero p{color:var(--ink2);font-size:15px;margin-top:10px;max-width:44em}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:26px;align-items:start;padding:26px 0 80px}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.pl-g{margin-bottom:16px}
.pl-g>b{display:block;font-size:10.5px;letter-spacing:.2em;color:var(--dim);margin-bottom:9px}
.pl-chips{display:flex;flex-wrap:wrap;gap:7px}
.pl-chip{font:inherit;font-size:13px;padding:6px 13px;border-radius:99px;cursor:pointer;
  color:var(--ink2);background:rgba(255,255,255,.03);border:1px solid var(--line);transition:.2s}
.pl-chip:hover{border-color:var(--line2);color:var(--ink)}
.pl-chip.on{background:linear-gradient(135deg,var(--ac),#ff5a2c);border-color:transparent;color:#fff;font-weight:600}
.pl-sel{display:flex;flex-wrap:wrap;gap:8px;min-height:38px;align-items:center;margin:6px 0 14px}
.pl-empty{color:var(--dim);font-size:13px}
.pl-pick{display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 6px;border-radius:99px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:13px}
.pl-pick i{width:19px;height:19px;border-radius:50%;background:var(--ac);color:#0a0d12;font-style:normal;
  font-size:11px;font-weight:700;display:grid;place-items:center}
.pl-pick em{font-style:normal;cursor:pointer;color:var(--dim);padding:0 2px}
.pl-pick em:hover{color:var(--ac)}
#plGo{width:100%;padding:12px;border-radius:12px;border:0;cursor:pointer;font:inherit;font-size:14.5px;font-weight:700;
  color:#fff;background:linear-gradient(135deg,var(--ac),#ff5a2c);transition:.2s}
#plGo:disabled{background:rgba(255,255,255,.06);color:var(--dim);cursor:not-allowed}
.pl-tips{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);opacity:0;pointer-events:none;
  background:rgba(9,13,20,.94);border:1px solid var(--line2);border-radius:12px;padding:9px 16px;font-size:13px;transition:.25s;z-index:60}
.pl-tips.show{opacity:1;transform:translate(-50%,0)}
/* 结果区 */
#plOut{min-height:200px}
#plOut.has .pl-head h2{font-family:var(--fd);font-size:30px;font-weight:400;line-height:1.3}
.pl-head p{color:var(--ink2);font-size:14px;margin-top:8px}
.pl-head b{color:var(--ink)}
.pl-note{display:block;font-size:11.5px;color:var(--dim);margin-top:4px}
.pl-day{margin-top:22px;border-left:2px solid rgba(255,122,69,.35);padding-left:18px}
.pl-day-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.pl-day-h i{font-style:normal;font-family:var(--fd);font-size:22px;color:var(--ac)}
.pl-day-h b{font-size:13px;color:var(--ink2);font-weight:600}
.pl-day-h span{font-size:12px;color:var(--dim)}
.pl-stop{position:relative;padding:10px 0 10px 0}
.pl-stop-n{position:absolute;left:-27px;top:12px;width:18px;height:18px;border-radius:50%;background:var(--ac);
  color:#0a0d12;font-size:11px;font-weight:700;display:grid;place-items:center}
.pl-stop-b b{display:block;font-size:17px}
.pl-stop-b span{display:block;font-size:13px;color:var(--ink2)}
.pl-stop-b em{display:block;font-style:normal;font-size:12px;color:var(--dim);margin-top:3px}
.pl-leg{font-size:11.5px;color:var(--dim);padding:4px 0 4px 2px}
.pl-actions{display:flex;gap:10px;margin-top:26px}
.pl-actions button{flex:1;padding:11px;border-radius:12px;border:0;cursor:pointer;font:inherit;font-size:14px;font-weight:600;
  color:#fff;background:linear-gradient(135deg,var(--ac),#ff5a2c)}
.pl-actions button.ghost{background:rgba(255,255,255,.05);color:var(--ink2);border:1px solid var(--line)}
.pl-map{width:100%;height:auto;display:block}
.side .panel+.panel{margin-top:16px}
.side h3{font-size:13px;letter-spacing:.14em;color:var(--dim);font-weight:500;margin-bottom:12px}
.side p{font-size:12.5px;color:var(--ink2)}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
.kv:last-child{border:0}
.kv span{color:var(--dim)}
</style>
</head>
<body>
<header class="topbar"><div class="wrap">
  <a class="brand" href="index.html">‹ 山城重庆</a>
  <nav><a href="index.html">首页</a><a href="district.html">区县</a></nav>
</div></header>

<div class="wrap">
  <div class="hero">
    <h1>行程规划</h1>
    <p>选 2–5 个区县，按地理距离自动排序、切成一日或两日，并估算车程。生成后可导出成一张行程单图片。</p>
  </div>

  <div class="layout">
    <div class="panel">
      <div id="plList"></div>
      <div class="pl-sel" id="plSel"></div>
      <button id="plGo" type="button" disabled>再选 2 个</button>
    </div>

    <div class="side">
      <div class="panel" id="plMap"></div>
      <div class="panel">
        <h3>结果</h3>
        <div id="plOut"><div class="pl-empty">选好区县后点「生成路线」</div></div>
      </div>
      <div class="panel">
        <h3>估算口径</h3>
        <div class="kv"><span>公路折算</span><b>直线 × 1.32</b></div>
        <div class="kv"><span>平均车速</span><b>52 km/h</b></div>
        <div class="kv"><span>单日上限</span><b>3 区县 / 5.5 小时</b></div>
        <p style="margin-top:10px">里程与车时用于行程可行性判断，实际请以导航为准。</p>
      </div>
    </div>
  </div>
</div>

<div class="pl-tips" id="plTips"></div>

<script defer src="assets/js/data.js"></script>
<script defer src="assets/js/districts-deep-data.js?v=20261019a"></script>
<script defer src="assets/js/plan.js?v=20261019e"></script>
<script defer src="assets/js/agent.js?v=20261019b"></script>
</body>
</html>
